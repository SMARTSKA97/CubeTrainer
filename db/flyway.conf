# Used by `flyway -configFiles=db/flyway.conf migrate`. Credentials come from the environment:
#   FLYWAY_URL=jdbc:postgresql://host/db?sslmode=require  FLYWAY_USER=...  FLYWAY_PASSWORD=...
flyway.locations=filesystem:db/migrations
flyway.validateMigrationNaming=true
flyway.connectRetries=10
flyway.cleanDisabled=true
flyway.baselineOnMigrate=false
