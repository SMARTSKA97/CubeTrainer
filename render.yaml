# Render Blueprint for the API (optional: you can also create the service by hand in the Render dashboard).
services:
  - type: web
    name: cubetrainer-api
    runtime: docker
    plan: free
    autoDeploy: false          # CI migrates the database first, then calls the deploy hook
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL        # Neon connection string (set it in the Render dashboard)
        sync: false
      - key: CORS_ORIGINS        # the web app, plus https://localhost (the origin of the Android app)
        value: https://cubetrainer.ska97homelab.uk,https://localhost
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Proxy__TrustForwardedHeaders
        value: "true"
      - key: Jwt__SigningKey       # openssl rand -base64 64
        sync: false
      - key: Totp__EncryptionKey   # openssl rand -base64 32 (keep a copy: losing it locks 2FA users out)
        sync: false
      - key: Email__Provider
        value: Brevo
      - key: Email__BrevoApiKey
        sync: false
      - key: Email__FromAddress    # a sender on YOUR domain, authenticated in Brevo
        value: no-reply@ska97homelab.uk
      - key: Email__FromName
        value: CubeTrainer
      - key: Web__BaseUrl          # your web app's public URL; used in email links
        value: https://cubetrainer.ska97homelab.uk
      - key: Auth__Cookie__SameSite  # web and API share the registrable domain ska97homelab.uk
        value: Lax
      - key: ExternalAuth__CallbackBaseUrl  # public API address, used to build the social-login redirect URLs
        value: https://cubetrainer-api.ska97homelab.uk
      # Social login is optional: add ExternalAuth__Providers__<google|microsoft|github|facebook>__ClientId / __ClientSecret in the dashboard.
